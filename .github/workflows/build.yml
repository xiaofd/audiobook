# CI/CD：编译验证 + Tag 发布
#
# 触发方式：
#   - push 到 main / PR：仅编译验证（保证可构建）
#   - 推送 v* 标签：编译全部产物并发布 GitHub Release
#
# 产物清单：
#   - audiobook-server-<os>-<arch>：Web/无头服务端（纯 Go 零 CGO，交叉编译）
#   - audiobook.exe：Windows 桌面端（Wails）
#   - checksums.txt：全部产物的 SHA256

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Web/无头服务端：多平台交叉编译 ----------
  server:
    name: server (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build   # 产物输出到 cmd/web/dist（vite.config.ts outDir）

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p out
          go build -trimpath -ldflags='-s -w' \
            -o "out/audiobook-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/web

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  # ---------- Windows 桌面端（Wails GUI） ----------
  windows-gui:
    name: windows-gui (wails)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI and NSIS
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          choco install nsis -y --no-progress

      - name: Build desktop app
        run: wails build -skipbindings -clean -nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "build/bin/*.exe" out/
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: out/*
          if-no-files-found: error

  # ---------- 发布：打 v* 标签时汇总产物并创建 Release ----------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, windows-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
